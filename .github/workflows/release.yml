name: Release

# Push a tag such as v2.12.0 and this builds both APKs, signs them with the project key and publishes a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: warp/go.mod
          cache-dependency-path: warp/go.sum

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;35.0.0" > /dev/null

      - name: Build the WARP helper
        run: warp/build.sh

      # A release is never signed with a throw-away key: stop if the secrets are missing
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] || { echo "::error::KEYSTORE_B64 / KEYSTORE_PASS secrets are not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf %s "$KEYSTORE_PASS" > release.pass

      # v2.12.0 -> versionName 2.12.0, versionCode 21200 (always rises with the tag)
      - name: Version from the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          PA="${PA%%[^0-9]*}"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MA * 10000 + MI * 100 + ${PA:-0}))" >> "$GITHUB_ENV"

      # The version's section of CHANGELOG.md becomes the release notes
      - name: Release notes
        run: |
          awk -v v="$VERSION_NAME" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "FMHYPlay $VERSION_NAME" > notes.md

      - name: Build
        run: ./build.sh

      # Fixed names too, so https://github.com/fmhyplay/android/releases/latest/download/FMHYPlay-TV.apk is always the newest
      # (Fire TV Downloader codes and links point there). The in-app updater only picks the versioned "-TV-" / "-Android-" files.
      - name: Latest copies
        run: |
          cp "FMHYPlay-TV-v$VERSION_NAME.apk" FMHYPlay-TV.apk
          cp "FMHYPlay-Android-v$VERSION_NAME.apk" FMHYPlay-Android.apk

      - name: Checksums and signer
        run: |
          sha256sum FMHYPlay-*.apk | tee SHA256SUMS.txt
          for f in FMHYPlay-*.apk; do
            "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$f" | grep -E "Signer #1 certificate SHA-256"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FMHYPlay-*.apk SHA256SUMS.txt \
            --title "FMHYPlay $VERSION_NAME" --notes-file notes.md
