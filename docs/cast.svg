<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3b5c"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a90a8"/></marker>
  </defs>
  <rect width="960" height="470" rx="20" fill="#120e1a"/>
  <text x="36" y="48" fill="#f2edf7" font-size="22" font-weight="700">Cast from your phone to your TV</text>
  <text x="36" y="74" fill="#9a90a8" font-size="14">Phone and TV on the same Wi-Fi. In the player, tap Cast and pick the TV.</text>

  <!-- phone -->
  <rect x="44" y="118" width="156" height="290" rx="24" fill="#1e1828" stroke="#3a3048" stroke-width="2"/>
  <rect x="56" y="146" width="132" height="210" rx="10" fill="#0d0a13"/>
  <circle cx="122" cy="222" r="26" fill="#2a2236"/>
  <path d="M114 208v28l22-14z" fill="#f2edf7"/>
  <rect x="80" y="300" width="84" height="32" rx="16" fill="#ff3b5c"/>
  <path d="M93 309h20v14h-6M93 318a6 6 0 0 1 6 6M93 313a11 11 0 0 1 11 11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="139" y="321" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Cast</text>
  <rect x="104" y="370" width="36" height="5" rx="2.5" fill="#3a3048"/>
  <text x="122" y="436" fill="#f2edf7" font-size="15" font-weight="600" text-anchor="middle">Phone</text>
  <text x="122" y="455" fill="#9a90a8" font-size="12.5" text-anchor="middle">becomes the remote</text>

  <!-- wi-fi -->
  <g fill="none" stroke="#9a90a8" stroke-width="3" stroke-linecap="round">
    <path d="M318 276a40 40 0 0 1 56 0"/><path d="M306 262a58 58 0 0 1 80 0"/><path d="M330 290a22 22 0 0 1 32 0"/>
  </g>
  <circle cx="346" cy="302" r="5" fill="#9a90a8"/>
  <text x="346" y="330" fill="#9a90a8" font-size="13" text-anchor="middle">same Wi-Fi</text>

  <!-- TV with FMHYPlay -->
  <rect x="560" y="104" width="360" height="158" rx="14" fill="#1e1828" stroke="#ff3b5c" stroke-width="2"/>
  <text x="584" y="140" fill="#f2edf7" font-size="17" font-weight="700">Bedroom - FMHYPlay</text>
  <rect x="784" y="124" width="116" height="24" rx="12" fill="#ff3b5c"/>
  <text x="842" y="141" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Recommended</text>
  <text x="584" y="170" fill="#9a90a8" font-size="13.5">FMHYPlay on the TV plays the stream itself,</text>
  <text x="584" y="190" fill="#9a90a8" font-size="13.5">with the site's headers and cookie, WARP,</text>
  <text x="584" y="210" fill="#9a90a8" font-size="13.5">ad block and subtitles. Opens even when</text>
  <text x="584" y="230" fill="#9a90a8" font-size="13.5">the app is closed on the TV.</text>
  <rect x="715" y="262" width="50" height="8" fill="#3a3048"/>

  <!-- Chromecast -->
  <rect x="560" y="300" width="360" height="140" rx="14" fill="#1e1828" stroke="#4b4060" stroke-width="2"/>
  <text x="584" y="336" fill="#f2edf7" font-size="17" font-weight="700">Bedroom - Chromecast</text>
  <text x="584" y="364" fill="#9a90a8" font-size="13.5">Chromecast, Google TV, TVs with Cast built in.</text>
  <text x="584" y="384" fill="#9a90a8" font-size="13.5">No app needed on the TV: the phone relays</text>
  <text x="584" y="404" fill="#9a90a8" font-size="13.5">the stream, so keep it on the same Wi-Fi.</text>

  <!-- arrows -->
  <path d="M206 176C330 120 450 120 552 150" fill="none" stroke="#ff3b5c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="380" y="118" fill="#f2edf7" font-size="13" text-anchor="middle">1  the video, from the same spot</text>
  <path d="M552 196C450 170 330 180 210 214" fill="none" stroke="#9a90a8" stroke-width="2" stroke-dasharray="6 6" marker-start="url(#m)" marker-end="url(#m)"/>
  <text x="430" y="206" fill="#9a90a8" font-size="12.5" text-anchor="middle">2  play · pause · seek · volume</text>
  <path d="M206 330C330 380 450 384 552 368" fill="none" stroke="#9a90a8" stroke-width="2" marker-end="url(#m)"/>
  <text x="380" y="402" fill="#9a90a8" font-size="12.5" text-anchor="middle">or: the stream through the phone</text>
</svg>
